<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixvo · Catálogo propuesto</title><style>body{margin:0;background:#03010e;color:#dad4de;font-family:Arial,sans-serif}header,main{max-width:1200px;margin:auto;padding:32px}header img{width:160px}h1{font-size:40px;color:white}b{color:#937aff}select{padding:12px;background:#201737;color:white;border:1px solid #937aff;border-radius:8px}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}article{border:1px solid #202128;border-radius:20px;overflow:hidden}figure{margin:0;height:320px;background-size:cover;background-position:center;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}figure h2{font-size:28px;text-shadow:0 2px 6px #000}figure small{letter-spacing:3px}article footer{padding:20px}p{line-height:1.6}a{color:#937aff}</style><header><img src="brand/pixvo-logo-header.webp" alt="Pixvo"><h1>Tu celebración.<br><b>Tu propia forma de invitar.</b></h1><p>Catálogo de 27 presets propuestos. Fondos propios de partida; este visor no es la plataforma final.</p><label for="category">Categoría </label><select id="category"><option value="all">Todas</option><option value="weddings">Bodas</option><option value="xv">XV años</option><option value="parties">Fiestas</option><option value="kids">Infantiles</option><option value="corporate">Corporativos</option></select></header><main><div id="grid"></div><p id="error" role="status"></p></main><script type="module">const grid=document.querySelector('#grid');try{const items=await fetch('templates/catalog.json').then(r=>{if(!r.ok)throw Error('No se pudo cargar el catálogo');return r.json()});function render(){grid.replaceChildren();for(const t of items.filter(t=>category.value==='all'||t.category===category.value)){const card=document.createElement('article');const f=document.createElement('figure');f.style.backgroundImage=`url("${t.backgroundAsset}")`;f.style.color=t.theme.foreground;const label=document.createElement('small');label.textContent=t.category.toUpperCase();const h=document.createElement('h2');h.textContent=t.name;h.style.color=t.theme.accent;const date=document.createElement('p');date.textContent='18 · DICIEMBRE · 2027';f.append(label,h,date);const footer=document.createElement('footer');footer.textContent=`${t.tier} · ${t.family}`;card.append(f,footer);grid.append(card)}}const category=document.querySelector('#category');category.addEventListener('change',render);render()}catch(e){document.querySelector('#error').textContent=e.message+'. Abrí este visor con python -m http.server 8080.'}</script></html>
